<!DOCTYPE html>
<html lang="en">

<body data-page="blog">
<div id="site-header"></div>

  <main id="main">
    <section class="page-hero theme-dark" aria-labelledby="pageTitle">
      <img class="bg-img" src="assets/images/logistics/dashboard-laptop.jpg" alt="">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron-right"></i><span aria-current="page">Blog</span></nav>
        <span class="eyebrow mt-3">NorthLane insights</span>
        <h1 id="pageTitle">Notes from the road, the port and the control tower</h1>
        <p class="lead">Practical thinking on freight, fleets and supply chains from the people who run ours.</p>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <article class="card featured-post" id="featuredPost" data-aos="fade-up"></article>
        <div class="blog-layout">
          <div>
            <div class="toolbar"><h2 class="h3" style="margin-right:auto">Latest articles</h2><span class="result-count" id="postCount" aria-live="polite"></span></div>

            <div class="pagination" id="postPager" aria-label="Article pages"></div>
          </div>

            <div class="card widget"><h3>Tags</h3><div class="tag-cloud" id="tagCloud"></div></div>
          </aside>
        </div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="js/icons.js" defer></script>
