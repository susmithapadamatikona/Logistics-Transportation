<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found (404) | NorthLane Logistics</title>
  <meta name="description" content="The page you are looking for has taken a wrong turn. Track a shipment, get a quote or head back to the NorthLane homepage.">
  <meta name="theme-color" content="#07111F">
  <meta property="og:title" content="Page Not Found (404) | NorthLane Logistics">
  <meta property="og:description" content="The page you are looking for has taken a wrong turn. Track a shipment, get a quote or head back to the NorthLane homepage.">
  <meta property="og:image" content="assets/images/hero/hero-truck-night.jpg">
  <meta name="robots" content="noindex">
  <link rel="preload" as="image" href="assets/images/stackly-logo.webp" fetchpriority="high">
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/services.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>document.documentElement.classList.add('nl-loading');try{if(JSON.parse(localStorage.getItem('nl_prefs')||'{}').theme==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body data-page="404" data-layout="bare">
  <main id="main">
    <section class="error-page theme-dark" aria-labelledby="pageTitle">
      <div class="container">
        <a class="brand error-brand" href="index.html" aria-label="Stackly home"><span data-brand></span></a>
        <div class="error-code" aria-hidden="true">404</div>
        <div class="error-road" aria-hidden="true"><div class="vehicle-marker"><i data-icon="truck"></i></div><span class="lost-pin"><i data-icon="map-pin"></i></span></div>
        <h1 id="pageTitle" style="font-size:clamp(1.8rem,3.4vw,2.6rem)">This shipment took a wrong turn</h1>
        <p class="lead" style="margin:14px auto 0;max-width:560px;color:#C3D1DE">We couldn't find the page you were looking for. It may have been moved, or the link might be mistyped.</p>
        <div class="error-links">
          <a class="btn btn-accent btn-lg" href="index.html"><i data-icon="home"></i>Back to Home</a>
          <a class="btn btn-ghost btn-lg" href="index.html" id="goBack"><i data-icon="arrow-left"></i>Go Back</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    /* "Go Back" returns to the previous page; with no history (opened directly) it falls back to the homepage */
    document.getElementById('goBack').addEventListener('click', function (e) {
      if (history.length > 1 && document.referrer) { e.preventDefault(); e.stopPropagation(); history.back(); }
    }, true);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
